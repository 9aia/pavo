[workspace]
resolver = "2"
members = [
    "crates/pavo-cli",
    "crates/pavo-core",
    "crates/pavo-driver-cli",
    "crates/pavo-driver-config",
    "crates/pavo-driver-kit",
    "crates/pavo-driver-mcp",
    "crates/pavo-protocol",
    "crates/pavo-testkit",
    "crates/pavo-tui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/pavo"
description = "Visualization host — tamias drivers render ViewNode IR on every surface"
homepage = "https://9aia.com/pavo"
documentation = "https://9aia.com/pavo"
authors = ["9aia"]
keywords = ["visualization", "dashboard", "tui", "cli", "drivers"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
pavo-protocol = { path = "crates/pavo-protocol", version = "0.1.0" }
pavo-core = { path = "crates/pavo-core", version = "0.1.0" }
pavo-driver-kit = { path = "crates/pavo-driver-kit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1.5"
ratatui = "0.30"
crossterm = "0.29"
toml_edit = "0.25"
# scarab — config expertise; pavo-driver-config's merge/env overlay rides it (P-045)
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "4e32a347dd775efdccc675d0e1f4a10e7a26153f", version = "0.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
unwrap_used = "warn"
