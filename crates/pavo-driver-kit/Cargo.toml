[package]
name = "pavo-driver-kit"
description = "pavo-driver-kit — declarative driver authoring for tamias drivers (manifest builders, ViewNode constructors, ndjson serve loop)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# Surface-driver layer (surface::*) — the ops-manifest types and
# spawned-driver client are always compiled; the generated-CLI and
# MCP surfaces are opt-in so view drivers stay dependency-light.
default = []
cli = ["dep:clap"]
mcp = []

[dependencies]
pavo-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# Generated CLI surface — only when `cli` is enabled.
clap = { workspace = true, optional = true }

[lints]
workspace = true
